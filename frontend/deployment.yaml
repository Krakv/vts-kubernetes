apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: vts
  labels:
    project: vts-project
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        project: vts-project
        app: frontend
    spec:
      containers:
        - name: frontend
          image: krakv/task-manager-front:ac26fb5
          imagePullPolicy: Always
          ports:
            - containerPort: 80
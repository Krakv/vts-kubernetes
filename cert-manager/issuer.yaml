apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vts-issuer
  namespace: vts
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: gateway
                namespace: vts
                kind: Gateway